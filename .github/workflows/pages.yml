name: Publish Residual Inertia
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build static website
        run: python3 scripts/build.py
      - name: Validate public output
        run: python3 scripts/check.py
      - name: Check score boundaries and research navigation
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Check motion accessibility and account navigation
        run: |
          node tests/site-motion.cjs
          node tests/account-nav.cjs
          node tests/market-chart.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
