<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 604" width="600" height="604" role="img" aria-labelledby="title desc">
<title id="title">A smaller gap outside the crisis</title><desc id="desc">Full sample: all starts 16.0%, high signal 22.2%. Excluding forward windows overlapping October 2007 to March 2009: 14.1% and 15.7%. Bars use a common zero baseline and scale. Differences are descriptive, not statistically established.</desc>
<rect width="600" height="604" fill="#F2F2EB"/>
<g font-family="Arial, Noto Sans SC, Microsoft YaHei, sans-serif"><text x="24" y="36" font-size="28" fill="#0A2122" text-anchor="start" font-weight="600">A smaller gap outside the crisis</text><text x="24" y="69" font-size="20" fill="#526260" text-anchor="start" font-weight="400">Average maximum drawdown over the next 12 months</text><text x="24" y="117" font-size="23" fill="#0A2122" text-anchor="start" font-weight="600">Full sample</text><text x="24" y="175" font-size="21" fill="#526260" text-anchor="start" font-weight="400">All starts</text><rect x="157" y="155" width="173.431" height="29" fill="#0A2122"/><text x="342.431" y="178" font-size="23" fill="#0A2122" text-anchor="start" font-weight="600">16.0%</text><text x="24" y="228" font-size="21" fill="#526260" text-anchor="start" font-weight="400">High signal</text><rect x="157" y="208" width="240.502" height="29" fill="#005CC2"/><text x="409.502" y="231" font-size="23" fill="#005CC2" text-anchor="start" font-weight="600">22.2%</text><text x="157" y="280" font-size="22" fill="#005CC2" text-anchor="start" font-weight="600">Gap: 6.2 percentage points</text><text x="24" y="339" font-size="23" fill="#0A2122" text-anchor="start" font-weight="600">Excluding financial-crisis windows</text><text x="24" y="397" font-size="21" fill="#526260" text-anchor="start" font-weight="400">All starts</text><rect x="157" y="377" width="153.013" height="29" fill="#0A2122"/><text x="322.013" y="400" font-size="23" fill="#0A2122" text-anchor="start" font-weight="600">14.1%</text><text x="24" y="450" font-size="21" fill="#526260" text-anchor="start" font-weight="400">High signal</text><rect x="157" y="430" width="169.681" height="29" fill="#005CC2"/><text x="338.681" y="453" font-size="23" fill="#005CC2" text-anchor="start" font-weight="600">15.7%</text><text x="157" y="502" font-size="22" fill="#005CC2" text-anchor="start" font-weight="600">Gap: 1.5 percentage points</text><text x="24" y="550" font-size="19" fill="#526260" text-anchor="start" font-weight="400">High signal: annual growth in margin debt / price</text><text x="24" y="578" font-size="18" fill="#526260" text-anchor="start" font-weight="400">above its past 80th percentile. All starts include high starts.</text></g></svg>